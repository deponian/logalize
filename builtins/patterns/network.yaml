patterns:
  # 0.0.0.0
  # 10.0.0.200/16
  # 127.0.0.1:8080
  ipv4-address:
    priority: -4
    regexps:
      # 0.0.0.0
      - regexp: ((?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3})
        name: address
      # /16
      # :8080
      - regexp: ((?::\d{1,5}|/\d{1,2})?)
        name: mask-or-port

  # 2001:db8:4006:812::200e
  # [2001:db8:4006:812::200e]:8080
  ipv6-address:
    priority: -3
    regexps:
      # [
      - regexp: (\[?)
        name: opening-bracket
      # 2001:db8:4006:812::200e
      - regexp: ((?:[[:xdigit:]]{0,4}:){2,7}(?:(?:(?:(?:25[0-5]|2[0-4]\d|1?\d\d?)\.){3}(?:25[0-5]|2[0-4]\d|1?\d\d?))|[[:xdigit:]]{0,4}|:))
        name: address
      # ]
      - regexp: (\]?)
        name: closing-bracket
      # :8080
      - regexp: ((?::\d{1,5})?)
        name: port

  # 3D:F2:C9:A6:B3:4F
  # 3D-F2-C9-A6-B3-4F
  mac-address:
    regexp: ((?:[[:xdigit:]]{2}[:-]){5}[[:xdigit:]]{2})

  # https://example.com
  # https://user:password@10.0.0.200:8080/path/to/file?q=value#fragment
  # git+ssh://git@example.com:22/deponian/logalize.git
  url:
    # must stay above "logfmt-general" (it would tear a URL apart at its
    # first "=" sign) and below "logfmt-string" (a URL inside a quoted
    # value is found when that value comes back to the patterns)
    priority: 2
    regexps:
      # separate the URL from the previous word-ish thing;
      # a URL right after an equals sign is left alone on purpose:
      # "logfmt-general" claims the whole key=value pair and sends
      # the value back here, where the URL starts the string
      - regexp: (^["']?|[^[:alnum:]="']|[^=]["'])
        name: start
      # https
      - regexp: ([[:alpha:]][[:alnum:]+.-]*)
        name: scheme
      # ://
      - regexp: (://)
        name: separator
      # user:password@
      - regexp: ((?:[^\s/?#@"'<>]*@)?)
        name: userinfo
      # example.com
      # 10.0.0.200
      # [2001:db8:4006:812::200e]
      - regexp: (\[[^\s\]"'<>]*\]|[^\s/?#:"'<>]*)
        name: host
      # :8080
      - regexp: ((?::\d{1,5})?)
        name: port
      # /path/to/file
      - regexp: ((?:/(?:[^\s?#"'<>]*[^\s?#"'<>.,;:!)\]}])?)?)
        name: path
      # ?q=value
      - regexp: ((?:\?(?:[^\s#"'<>]*[^\s#"'<>.,;:!)\]}])?)?)
        name: query
      # #fragment
      - regexp: ((?:#(?:[^\s"'<>]*[^\s"'<>.,;:!)\]}])?)?)
        name: fragment
