patterns:
  # xxxxx=xxxxxxx
  logfmt-general:
    priority: 1
    regexps:
      - regexp: ((?:^|[\t ]+)[^=\t ]+)
        name: key
      - regexp: (=)
        name: equal-sign
      - regexp: ([^\s]+)
        name: value

  # xxxxx="xxxxxxx"
  logfmt-string:
    # must stay above "url" (see builtins/patterns/network.yaml)
    priority: 3
    regexps:
      - regexp: ((?:^|[\t ]+)[^=\t ]+)
        name: key
      - regexp: (=)
        name: equal-sign
      - regexp: (")
        name: opening-quotation-mark
      - regexp: (.+?[^\\])
        name: value
      - regexp: (")
        name: closing-quotation-mark
