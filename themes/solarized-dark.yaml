# Source: https://github.com/altercation/solarized
themes:
  solarized-dark:
    # default color is used for anything that is not fall into a format, pattern or word
    # if you don't specify a default color, the normal color of your terminal will be used
    #default:
    #  fg: "#ff0000"
    #  bg: "#00ff00"
    #  style: "bold"

    formats:
      # INFO:
      # Combined Log Format (NCSA combined/XLF/ELF), the de facto standard access log
      # format shared by Apache httpd ("combined"), Nginx ("combined"), Traefik ("genericCLF") and others
      #
      # SOURCE:
      # https://httpd.apache.org/docs/current/logs.html#combined
      # https://nginx.org/en/docs/http/ngx_http_log_module.html
      # https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/#generic-clf-format-fields
      #
      # SCHEME:
      # (Apache): %h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-agent}i"
      # (Nginx): $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"
      # (Traefik): <remote_IP_address> - <client_user_name_if_available> [<timestamp>] "<request_method> <request_path> <request_protocol>" <HTTP_status> <content-length> "<request_referrer>" "<request_user_agent>"
      combined-log-format:
        remote-addr:
          fg: "#3496de"
        ident:
          fg: "#93a1a1"
        remote-user:
          fg: "#859900"
        timestamp:
          fg: "#8289de"
        request:
          fg: "#eee8d5"
        status:
          fg: "#93a1a1"
          1xx:
            fg: "#3496de"
            style: bold
          2xx:
            fg: "#859900"
            style: bold
          3xx:
            fg: "#2aa198"
            style: bold
          4xx:
            fg: "#fd544b"
            style: bold
          5xx:
            fg: "#f2559c"
            style: bold
        body-bytes-sent:
          fg: "#2aa198"
        http-referer:
          fg: "#eee8d5"
        http-user-agent:
          fg: "#93a1a1"

      # INFO:
      # Traefik access log in CLF (Common Log Format) mode, which is the Combined Log
      # Format plus four Traefik-specific fields appended after the user agent
      #
      # SOURCE:
      # https://doc.traefik.io/traefik/observability/access-logs/
      #
      # SCHEME:
      # <remote_IP_address> - <client_user_name_if_available> [<timestamp>] "<request_method> <request_path> <request_protocol>" <HTTP_status> <content-length> "<request_referrer>" "<request_user_agent>" <number_of_requests_received_since_Traefik_started> "<Traefik_router_name>" "<Traefik_server_URL>" <request_duration_in_ms>ms
      traefik-common:
        remote-addr:
          fg: "#3496de"
        ident:
          fg: "#93a1a1"
        remote-user:
          fg: "#859900"
        timestamp:
          fg: "#8289de"
        request:
          fg: "#eee8d5"
        status:
          fg: "#93a1a1"
          1xx:
            fg: "#3496de"
            style: bold
          2xx:
            fg: "#859900"
            style: bold
          3xx:
            fg: "#2aa198"
            style: bold
          4xx:
            fg: "#fd544b"
            style: bold
          5xx:
            fg: "#f2559c"
            style: bold
        content-length:
          fg: "#2aa198"
        referer:
          fg: "#eee8d5"
        user-agent:
          fg: "#93a1a1"
        request-count:
          fg: "#2aa198"
        router-name:
          fg: "#859900"
        server-url:
          fg: "#eee8d5"
        duration:
          fg: "#f2559c"

      # INFO:
      # Ingress Nginx default format
      #
      # SOURCE:
      # https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/log-format/
      #
      # SCHEME:
      # $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id
      ingress-nginx-controller:
        remote-addr:
          fg: "#3496de"
        dash:
          fg: "#93a1a1"
        remote-user:
          fg: "#859900"
        time-local:
          fg: "#8289de"
        request:
          fg: "#eee8d5"
        status:
          fg: "#93a1a1"
          1xx:
            fg: "#3496de"
            style: bold
          2xx:
            fg: "#859900"
            style: bold
          3xx:
            fg: "#2aa198"
            style: bold
          4xx:
            fg: "#fd544b"
            style: bold
          5xx:
            fg: "#f2559c"
            style: bold
        body-bytes-sent:
          fg: "#2aa198"
        http-referer:
          fg: "#eee8d5"
        http-user-agent:
          fg: "#93a1a1"
        request-length:
          fg: "#2aa198"
        request-time:
          fg: "#f2559c"
        proxy-upstream-name:
          fg: "#859900"
        proxy-alternative-upstream-name:
          fg: "#93a1a1"
        upstream-addr:
          fg: "#3496de"
        upstream-response-length:
          fg: "#2aa198"
        upstream-response-time:
          fg: "#f2559c"
        upstream-status:
          fg: "#93a1a1"
          1xx:
            fg: "#3496de"
            style: bold
          2xx:
            fg: "#859900"
            style: bold
          3xx:
            fg: "#2aa198"
            style: bold
          4xx:
            fg: "#fd544b"
            style: bold
          5xx:
            fg: "#f2559c"
            style: bold
        req-id:
          fg: "#eb6839"

      # INFO:
      # klog format, useful for things like Cert Manager, Cluster Autoscaler and other Kubernetes-related logs
      #
      # SOURCE:
      # https://github.com/kubernetes/klog/blob/9ad246211af1ed84621ee94a26fcce0038b69cd1/klog.go#L581-L597
      #
      # SCHEME:
      # Lmmdd hh:mm:ss.uuuuuu threadid file:line] msg...
      #
      # where the fields are defined as follows:
      # 	L                A single character, representing the log level (eg 'I' for INFO)
      # 	mm               The month (zero padded; ie May is '05')
      # 	dd               The day (zero padded)
      # 	hh:mm:ss.uuuuuu  Time in hours, minutes and fractional seconds
      # 	threadid         The space-padded thread ID as returned by GetTID()
      # 	file             The file name
      # 	line             The line number
      # 	msg              The user-supplied message
      klog:
        log-level:
          info:
            fg: "#3496de"
            style: bold
          warning:
            fg: "#b58900"
            style: bold
          error:
            fg: "#fd544b"
            style: bold
          fatal:
            fg: "#f2559c"
            style: bold
        time:
          fg: "#f2559c"
        thread-id:
          fg: "#eb6839"
        filename:
          fg: "#859900"
        line-number:
          fg: "#2aa198"
        bracket:
          fg: "#93a1a1"
        message:
          style: "patterns-and-words"

      # INFO:
      # Redis default log format
      #
      # SOURCE:
      # https://github.com/redis/redis/issues/12918#issuecomment-1880735488
      # https://github.com/redis/redis/issues/2545#issuecomment-97270522
      #
      # SCHEME:
      # PID:ROLE day month year hh:mm:ss.uuu log-level-char msg
      redis:
        pid:
          fg: "#eb6839"
        colon:
          fg: "#93a1a1"
        role:
          master:
            fg: "#f2559c"
            style: bold
          replica:
            fg: "#3496de"
            style: bold
          sentinel:
            fg: "#b58900"
            style: bold
          rdb-aof-writing-child:
            fg: "#859900"
            style: bold
        date:
          fg: "#8289de"
        time:
          fg: "#f2559c"
        log-level:
          warning:
            fg: "#b58900"
            style: bold
          notice:
            fg: "#2aa198"
            style: bold
          info:
            fg: "#3496de"
            style: bold
          debug:
            fg: "#859900"
            style: bold
        message:
          style: "patterns-and-words"

      # INFO:
      # Syslog (RFC 3164)
      #
      # SOURCE:
      # https://www.rfc-editor.org/rfc/rfc3164.html
      #
      # SCHEME:
      # <priority>Mmm dd hh:mm:ss hostname program[pid]: message
      syslog-rfc3164:
        priority:
          fg: "#2aa198"
        date:
          fg: "#8289de"
        time:
          fg: "#f2559c"
        hostname:
          fg: "#3496de"
        program:
          fg: "#859900"
        pid:
          fg: "#eb6839"
        colon:
          fg: "#93a1a1"
        message:
          style: "patterns-and-words"

    patterns:
      # 2024-02-17T06:56:10Z
      # 2024-02-17T06:56:10.636960544Z
      # 2024-02-17T06:56:10.636960544+01:00
      rfc3339:
        # 2024-02-17
        date:
          fg: "#8289de"
        # T
        t-delimiter:
          fg: "#93a1a1"
        # 06:56:10.636960544
        time:
          fg: "#f2559c"
        # Z
        # +01:00
        offset:
          fg: "#93a1a1"

      # 23:42:12
      # 23:42:12.034123
      time:
        fg: "#f2559c"

      # 1999-07-10
      # 1999/07/10
      # 07-10-1999
      # 07/10/1999
      date-1:
        fg: "#8289de"

      # 27 Jan
      # 27 January
      # 27 Jan 2023
      # 27 August 2023
      # 27-Jan-2023
      # 27-August-2023
      # 27/Jan/2023
      # 27/August/2023
      date-2:
        fg: "#8289de"

      # Jan 27
      # January 27
      # Jan 27 2023
      # August 27 2023
      # Jan-27-2023
      # August-27-2023
      # Jan/27/2023
      # August/27/2023
      date-3:
        fg: "#8289de"

      # Mon 17
      # Sunday 3
      date-4:
        fg: "#8289de"

      # 5s
      # 7.5h
      # 75.984854ms
      duration:
        # 7.5
        number:
          fg: "#f2559c"
        # h
        unit:
          fg: "#93a1a1"

      # xxxxx=xxxxxxx
      logfmt-general:
        key:
          fg: "#3496de"
        equal-sign:
          fg: "#93a1a1"
        value:
          style: patterns-and-words

      # xxxxx="xxxxxxx"
      logfmt-string:
        key:
          fg: "#3496de"
        equal-sign:
          fg: "#93a1a1"
        opening-quotation-mark:
          fg: "#93a1a1"
        value:
          style: patterns-and-words
        closing-quotation-mark:
          fg: "#93a1a1"

      # 0.0.0.0
      # 10.0.0.200/16
      # 127.0.0.1:8080
      ipv4-address:
        # 10.0.0.200
        address:
          fg: "#3496de"
        # /16
        # :8080
        mask-or-port:
          fg: "#2aa198"

      # 2001:db8:4006:812::200e
      # [2001:db8:4006:812::200e]:8080
      ipv6-address:
        # [
        opening-bracket:
          fg: "#93a1a1"
        # 2001:db8:4006:812::200e
        address:
          fg: "#3496de"
        # ]
        closing-bracket:
          fg: "#93a1a1"
        # :8080
        port:
          fg: "#2aa198"

      # 3D:F2:C9:A6:B3:4F
      # 3D-F2-C9-A6-B3-4F
      mac-address:
        fg: "#3496de"

      # 0a99af43-0ad4-4237-b9cd-064966eb2803
      uuid:
        fg: "#eb6839"

    # see lists of the words themselves here: https://github.com/deponian/logalize/tree/main/builtins/words
    words:
      bad:
        fg: "#fd544b"
        style: bold
      good:
        fg: "#859900"
        style: bold
      info:
        fg: "#3496de"
        style: bold
      warning:
        fg: "#b58900"
        style: bold
